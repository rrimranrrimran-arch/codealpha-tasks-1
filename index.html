<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Player</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #141e30, #243b55);

            color: white;
        }

        .music-player {
            width: 380px;
            padding: 30px;

            background: rgba(255, 255, 255, 0.1);

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 25px;

            text-align: center;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);

            backdrop-filter: blur(15px);
        }

        /* Heading */

        .music-player h1 {
            margin-bottom: 20px;
            font-size: 28px;
        }

        /* Album Image */

        .album-image {
            width: 220px;
            height: 220px;

            margin: auto;

            border-radius: 20px;

            overflow: hidden;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .album-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        /* Song Information */

        .song-info {
            margin: 20px 0;
        }

        .song-info h2 {
            font-size: 22px;
            margin-bottom: 7px;
        }

        .song-info p {
            color: #bbb;
        }

        /* Progress Bar */

        .progress-container {
            margin: 20px 0;
        }

        #progress {
            width: 100%;
            cursor: pointer;
        }

        .time {
            display: flex;
            justify-content: space-between;

            font-size: 12px;
            color: #aaa;

            margin-top: 5px;
        }

        /* Controls */

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 15px;

            margin: 20px 0;
        }

        .controls button {
            width: 45px;
            height: 45px;

            border: none;

            border-radius: 50%;

            background: #ffffff;
            color: #222;

            font-size: 18px;

            cursor: pointer;

            transition: 0.3s;
        }

        .controls button:hover {
            transform: scale(1.1);

            background: #7c5cff;
            color: white;
        }

        .controls .play {
            width: 60px;
            height: 60px;

            background: #7c5cff;
            color: white;

            font-size: 23px;
        }

        /* Volume */

        .volume {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 15px;
        }

        .volume input {
            width: 100%;
            cursor: pointer;
        }

        /* Playlist */

        .playlist {
            margin-top: 25px;

            text-align: left;
        }

        .playlist h3 {
            margin-bottom: 10px;
        }

        .song {
            padding: 12px;

            margin-bottom: 8px;

            background: rgba(255, 255, 255, 0.08);

            border-radius: 10px;

            cursor: pointer;

            transition: 0.3s;
        }

        .song:hover {
            background: rgba(124, 92, 255, 0.5);
        }

        .song.active {
            background: #7c5cff;
        }

        /* Responsive */

        @media (max-width: 450px) {

            .music-player {
                width: 95%;
            }

            .album-image {
                width: 180px;
                height: 180px;
            }

        }

    </style>

</head>

<body>


<div class="music-player">

    <h1>🎵 My Music Player</h1>


    <!-- Album Image -->

    <div class="album-image">

        <img id="albumImage"
             src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=500&q=80">

    </div>


    <!-- Song Information -->

    <div class="song-info">

        <h2 id="songTitle">Midnight Dreams</h2>

        <p id="artist">Vibe Music</p>

    </div>


    <!-- Progress Bar -->

    <div class="progress-container">

        <input
            type="range"
            id="progress"
            min="0"
            max="100"
            value="0"
        >

        <div class="time">

            <span id="currentTime">0:00</span>

            <span id="duration">0:00</span>

        </div>

    </div>


    <!-- Controls -->

    <div class="controls">

        <button id="previous">⏮</button>

        <button class="play" id="play">▶</button>

        <button id="next">⏭</button>

    </div>


    <!-- Volume -->

    <div class="volume">

        🔊

        <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
        >

    </div>


    <!-- Playlist -->

    <div class="playlist">

        <h3>📋 Playlist</h3>

        <div id="playlist"></div>

    </div>


</div>


<!-- Audio -->

<audio id="audio"></audio>


<script>

    // ==============================
    // SONGS
    // ==============================

    const songs = [

        {
            title: "Midnight Dreams",
            artist: "Vibe Music",

            image:
            "https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=500&q=80",

            audio:
            "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
        },


        {
            title: "Ocean Waves",
            artist: "Dream Audio",

            image:
            "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=500&q=80",

            audio:
            "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
        },


        {
            title: "City Lights",
            artist: "Night Rider",

            image:
            "https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=500&q=80",

            audio:
            "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
        }

    ];


    // ==============================
    // GET HTML ELEMENTS
    // ==============================

    const audio = document.getElementById("audio");

    const playButton =
        document.getElementById("play");

    const previousButton =
        document.getElementById("previous");

    const nextButton =
        document.getElementById("next");

    const progress =
        document.getElementById("progress");

    const volume =
        document.getElementById("volume");

    const songTitle =
        document.getElementById("songTitle");

    const artist =
        document.getElementById("artist");

    const albumImage =
        document.getElementById("albumImage");

    const currentTime =
        document.getElementById("currentTime");

    const duration =
        document.getElementById("duration");

    const playlist =
        document.getElementById("playlist");


    // Current song

    let songIndex = 0;


    // ==============================
    // LOAD SONG
    // ==============================

    function loadSong(index) {

        const song = songs[index];

        songTitle.textContent =
            song.title;

        artist.textContent =
            song.artist;

        albumImage.src =
            song.image;

        audio.src =
            song.audio;

        displayPlaylist();
    }


    // ==============================
    // PLAY SONG
    // ==============================

    function playSong() {

        audio.play();

        playButton.textContent = "⏸";
    }


    // ==============================
    // PAUSE SONG
    // ==============================

    function pauseSong() {

        audio.pause();

        playButton.textContent = "▶";
    }


    // ==============================
    // PLAY / PAUSE
    // ==============================

    playButton.addEventListener(
        "click",
        function () {

            if (audio.paused) {

                playSong();

            } else {

                pauseSong();

            }

        }
    );


    // ==============================
    // NEXT SONG
    // ==============================

    nextButton.addEventListener(
        "click",
        function () {

            songIndex++;

            if (songIndex >= songs.length) {

                songIndex = 0;

            }

            loadSong(songIndex);

            playSong();

        }
    );


    // ==============================
    // PREVIOUS SONG
    // ==============================

    previousButton.addEventListener(
        "click",
        function () {

            songIndex--;

            if (songIndex < 0) {

                songIndex = songs.length - 1;

            }

            loadSong(songIndex);

            playSong();

        }
    );


    // ==============================
    // PROGRESS BAR
    // ==============================

    audio.addEventListener(
        "timeupdate",
        function () {

            if (!audio.duration) return;

            const progressValue =
                (audio.currentTime /
                audio.duration) * 100;

            progress.value =
                progressValue;

            currentTime.textContent =
                formatTime(audio.currentTime);

        }
    );


    // ==============================
    // SONG DURATION
    // ==============================

    audio.addEventListener(
        "loadedmetadata",
        function () {

            duration.textContent =
                formatTime(audio.duration);

        }
    );


    // ==============================
    // CHANGE SONG POSITION
    // ==============================

    progress.addEventListener(
        "input",
        function () {

            if (!audio.duration) return;

            audio.currentTime =
                (progress.value / 100)
                * audio.duration;

        }
    );


    // ==============================
    // VOLUME CONTROL
    // ==============================

    volume.addEventListener(
        "input",
        function () {

            audio.volume =
                volume.value;

        }
    );


    // ==============================
    // AUTO PLAY NEXT SONG
    // ==============================

    audio.addEventListener(
        "ended",
        function () {

            songIndex++;

            if (songIndex >= songs.length) {

                songIndex = 0;

            }

            loadSong(songIndex);

            playSong();

        }
    );


    // ==============================
    // PLAYLIST
    // ==============================

    function displayPlaylist() {

        playlist.innerHTML = "";

        songs.forEach(
            function (song, index) {

                const div =
                    document.createElement("div");

                div.className = "song";

                if (index === songIndex) {

                    div.classList.add("active");

                }

                div.textContent =
                    (index + 1) +
                    ". " +
                    song.title;


                div.addEventListener(
                    "click",
                    function () {

                        songIndex = index;

                        loadSong(songIndex);

                        playSong();

                    }
                );


                playlist.appendChild(div);

            }
        );

    }


    // ==============================
    // FORMAT TIME
    // ==============================

    function formatTime(seconds) {

        if (isNaN(seconds)) {

            return "0:00";

        }

        const minutes =
            Math.floor(seconds / 60);

        const secondsPart =
            Math.floor(seconds % 60);

        return minutes + ":" +
            String(secondsPart)
            .padStart(2, "0");

    }


    // ==============================
    // START PLAYER
    // ==============================

    audio.volume = 0.8;

    loadSong(songIndex);

</script>


</body>
</html>
